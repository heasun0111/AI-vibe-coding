name: CI

# 이 저장소의 브랜치 정책(CONTRIBUTING.md)에 따라 모든 PR과 main 병합에서 실행되는
# 지속적 통합(CI)·지속적 테스트(CT) 워크플로다. CLAUDE.md의 "구현 지침"·
# "단위/통합/시스템 테스트 지침"에 정의된 품질 게이트(Branch 커버리지 100%, 순환복잡도 10 이하,
# 중복 코드 8라인 이상 금지)를 실제로 강제한다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, quality gates, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Install quality-gate tooling
        run: pip install flake8 pylint radon xenon coverage

      - name: Detect Python source
        id: detect
        run: |
          if git ls-files -- '*.py' ':!:WP_Templates/*' ':!:OEM_Sample/*' | grep -q .; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No Python source yet
        if: steps.detect.outputs.has_code == 'false'
        run: |
          echo "::warning::.py 소스가 아직 없어 린트/복잡도/중복/테스트 단계를 건너뜁니다. \
          coding/tdd 서브에이전트가 구현을 시작하면 이 게이트가 자동으로 활성화됩니다."

      - name: Lint (flake8)
        if: steps.detect.outputs.has_code == 'true'
        run: flake8 --max-line-length=120 --extend-exclude=WP_Templates,OEM_Sample .

      - name: Cyclomatic complexity gate — CLAUDE.md 기준 10 이하 (xenon)
        if: steps.detect.outputs.has_code == 'true'
        run: >
          xenon --max-absolute B --max-modules B --max-average A
          --exclude "WP_Templates/*,OEM_Sample/*" .

      - name: Duplicate code gate — 8라인 이상 중복 금지 (pylint)
        if: steps.detect.outputs.has_code == 'true'
        run: |
          FILES=$(git ls-files -- '*.py' ':!:WP_Templates/*' ':!:OEM_Sample/*')
          pylint --disable=all --enable=duplicate-code --min-similarity-lines=8 $FILES

      - name: Run unit tests with branch coverage
        if: steps.detect.outputs.has_code == 'true'
        run: |
          coverage run --branch -m unittest discover -v
          coverage report -m

      - name: Enforce Branch coverage 100% (단위 테스트 지침)
        if: steps.detect.outputs.has_code == 'true'
        run: coverage report --fail-under=100

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            style
            perf
